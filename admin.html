<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจระบบ LINE — BPSchool</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f4f7fa;color:#183345}label{display:block;margin-top:20px}input,button{padding:12px;border:1px solid #bccbd4;border-radius:8px;font:inherit}input{max-width:95%}button{margin:12px 4px 0 0;background:#075d64;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:10px}</style><h1>ตรวจระบบ LINE</h1><p>สำหรับผู้ดูแล: ตรวจฐานข้อมูลและดูสรุปจากข้อความที่เก็บไว้ หน้านี้ไม่ส่งข้อความเข้า LINE</p><label for="secret">รหัสเข้าถึงของผู้ดูแล</label><input id="secret" type="password" autocomplete="off" size="48"><label for="date">วันที่รายงาน (เวลาประเทศไทย)</label><input id="date" type="date"><div><button id="status">ตรวจการเชื่อมต่อ</button><button id="summary">ดูสรุป</button><button id="clear">ล้างข้อมูลบนหน้านี้</button></div><pre id="result" aria-live="polite">พร้อมตรวจสอบ</pre><script src="/js/admin.js"></script></html>
